<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>大帅网关</title>
  <style>
    :root {
      --bg: #0b1210;
      --panel: #13201b;
      --text: #eef5f1;
      --muted: #93a79d;
      --jade: #6fbf9a;
      --user: #2a6b52;
      --bot: #1a2923;
      --line: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(800px 400px at 50% -10%, rgba(111,191,154,.18), transparent), var(--bg);
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--line); backdrop-filter: blur(10px);
      position: sticky; top: 0; background: rgba(11,18,16,.85); z-index: 2;
    }
    .brand { font-weight: 700; letter-spacing: .02em; }
    .brand small { display:block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px; }
    button, .iconbtn {
      border: 0; background: transparent; color: var(--jade); font-size: 14px; font-weight: 600;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 6px; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: transparent; padding: 4px 8px; }
    .composer {
      border-top: 1px solid var(--line); padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; background: rgba(11,18,16,.95);
    }
    textarea {
      flex: 1; min-height: 44px; max-height: 120px; resize: none; border-radius: 14px;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      padding: 12px; font: inherit;
    }
    #send {
      min-width: 72px; border-radius: 14px; background: linear-gradient(135deg, #6fbf9a, #9fd9b8);
      color: #04110c; font-weight: 700;
    }
    #send:disabled { opacity: .5; }
    .sheet {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10;
      align-items: flex-end; justify-content: center;
    }
    .sheet.show { display: flex; }
    .sheet .card {
      width: 100%; max-width: 560px; background: #101a16; border-radius: 18px 18px 0 0;
      padding: 18px 16px 28px; border-top: 1px solid var(--line);
    }
    label { display:block; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
    input, select {
      width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
      color: var(--text); padding: 12px; font: inherit;
    }
    .actions { display:flex; gap: 8px; margin-top: 16px; }
    .actions button {
      flex: 1; padding: 12px; border-radius: 12px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    }
    .actions .primary { background: var(--jade); color: #04110c; border: 0; font-weight: 700; }
    .chips { display:flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 8px; }
    .chip {
      border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; color: var(--muted); font-size: 13px; background: rgba(255,255,255,.03);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">大帅网关<small id="status">智能问答</small></div>
    <button class="iconbtn" id="btnSettings" type="button">设置</button>
  </header>
  <div class="chips">
    <button class="chip" type="button" data-q="用一句话介绍你自己">介绍自己</button>
    <button class="chip" type="button" data-q="帮我写一段开工问候">写段问候</button>
    <button class="chip" type="button" data-q="解释一下什么是 API 网关">解释网关</button>
  </div>
  <div id="log"></div>
  <div class="composer">
    <textarea id="input" placeholder="发消息给大帅网关…" rows="1"></textarea>
    <button id="send" type="button">发送</button>
  </div>

  <div class="sheet" id="sheet">
    <div class="card">
      <div class="brand">连接设置</div>
      <label>网关 Base URL（真机请改成电脑局域网 IP）</label>
      <input id="baseUrl" value="http://10.0.2.2:8010/v1" />
      <label>API Key</label>
      <input id="apiKey" type="password" value="sk-local-change-me" />
      <label>模型 / 路由</label>
      <select id="model">
        <option value="日常">日常</option>
        <option value="快速">快速</option>
        <option value="复杂">复杂</option>
        <option value="小说">小说</option>
        <option value="代码">代码</option>
        <option value="识图">识图</option>
        <option value="翻译">翻译</option>
        <option value="总结">总结</option>
        <option value="推理">推理</option>
        <option value="长文">长文</option>
        <option value="Agent">Agent</option>
      </select>
      <label>电脑控制台连接码（可粘贴）</label>
      <input id="pairingCode" placeholder="dashuai://pair?data=..." />
      <p id="lanHint" style="font-size:12px;color:var(--muted);margin:8px 0 0"></p>
      <div class="actions">
        <button type="button" id="btnCancel">取消</button>
        <button type="button" id="btnScan">扫码连接</button>
        <button type="button" id="btnTest">测试连接</button>
        <button type="button" class="primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      baseUrl: localStorage.getItem('ds_base') || 'http://10.0.2.2:8010/v1',
      apiKey: localStorage.getItem('ds_key') || 'sk-local-change-me',
      model: localStorage.getItem('ds_model') || '日常',
      busy: false,
      history: JSON.parse(localStorage.getItem('ds_history') || '[]'),
    };

    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const sheet = document.getElementById('sheet');

    function add(role, text) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    function persistHistory() {
      localStorage.setItem('ds_history', JSON.stringify(state.history.slice(-40)));
    }

    function persistConnection(baseUrl, apiKey) {
      state.baseUrl = String(baseUrl || '').trim().replace(/\/$/, '');
      state.apiKey = String(apiKey || '').trim();
      localStorage.setItem('ds_base', state.baseUrl);
      localStorage.setItem('ds_key', state.apiKey);
      document.getElementById('baseUrl').value = state.baseUrl;
      document.getElementById('apiKey').value = state.apiKey;
    }

    function parsePairingCode(raw) {
      const text = String(raw || '').trim();
      if (!text.startsWith('dashuai://pair?data=')) throw new Error('连接码格式不正确');
      let token = text.slice('dashuai://pair?data='.length).replace(/-/g, '+').replace(/_/g, '/');
      while (token.length % 4) token += '=';
      const binary = atob(token);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const data = JSON.parse(new TextDecoder().decode(bytes));
      if (data.type !== 'dashuai-gateway-pairing' || !data.baseUrl || !data.apiKey) {
        throw new Error('连接码缺少网关信息');
      }
      persistConnection(data.baseUrl, data.apiKey);
      document.getElementById('lanHint').textContent = '已导入：' + data.baseUrl + '，正在测试连接…';
      return data;
    }

    async function testConnection() {
      const hint = document.getElementById('lanHint');
      const base = document.getElementById('baseUrl').value.trim().replace(/\/v1\/?$/, '');
      const key = document.getElementById('apiKey').value.trim();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const res = await fetch(base + '/api/diagnostics/connect', {
          headers: { 'Authorization': 'Bearer ' + key },
          signal: controller.signal,
        });
        const body = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error('API Key 不正确，请重新扫码');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        persistConnection(document.getElementById('baseUrl').value, key);
        if (body.ok) {
          hint.textContent = '连接正常，可以开始使用';
          status.textContent = state.model + ' · 在线';
          return true;
        }
        const failed = Object.values(body.checks || {}).filter(x => !x.ok).map(x => x.message);
        hint.textContent = '网关已连接，但尚未就绪：' + failed.join('；');
        return false;
      } catch (e) {
        hint.textContent = e.name === 'AbortError'
          ? '连接超时，请确认电脑网关已重启且防火墙允许访问'
          : '连接失败：' + (e.message || e);
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    window.onDashuaiPairingCode = async function(value) {
      try {
        parsePairingCode(value);
        await testConnection();
      } catch (e) {
        document.getElementById('lanHint').textContent = '扫码失败：' + (e.message || e);
      }
    };

    function restore() {
      if (!state.history.length) {
        add('sys', '你好，我是大帅网关助手。先在设置里确认电脑网关已启动。');
        return;
      }
      state.history.forEach((m) => add(m.role === 'user' ? 'user' : 'bot', m.content));
    }

    async function chat(text) {
      if (state.busy) return;
      state.busy = true;
      sendBtn.disabled = true;
      status.textContent = '思考中…';
      add('user', text);
      state.history.push({ role: 'user', content: text });
      const bot = add('bot', '…');
      try {
        const messages = state.history.slice(-12);
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 180000);
        const res = await fetch(state.baseUrl.replace(/\/$/, '') + '/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + state.apiKey,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: state.model,
            messages,
            stream: false,
            temperature: 0.7,
          }),
          signal: controller.signal,
        });
        const raw = await res.text();
        clearTimeout(timer);
        if (res.status === 401) throw new Error('API Key 不正确，请重新扫码或同步');
        if (res.status === 402) throw new Error('未激活或 Token 不足，请打开电脑控制台');
        if (res.status === 429) throw new Error('请求过多或上游额度受限，请稍后重试');
        if (!res.ok) throw new Error(res.status + ' ' + raw.slice(0, 200));
        const data = JSON.parse(raw);
        const answer = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || raw;
        bot.textContent = answer;
        state.history.push({ role: 'assistant', content: answer });
        persistHistory();
        status.textContent = state.model + ' · 在线';
      } catch (e) {
        bot.textContent = '请求失败：' + (e.name === 'AbortError' ? '请求超时' : e.message) + '\n\n请点设置中的「测试连接」查看具体原因。';
        status.textContent = '连接失败';
      } finally {
        state.busy = false;
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = () => {
      const t = input.value.trim();
      if (!t) return;
      input.value = '';
      chat(t);
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
    document.querySelectorAll('.chip').forEach((b) => b.onclick = () => chat(b.dataset.q));

    document.getElementById('btnSettings').onclick = () => {
      document.getElementById('baseUrl').value = state.baseUrl;
      document.getElementById('apiKey').value = state.apiKey;
      document.getElementById('model').value = state.model;
      sheet.classList.add('show');
    };
    document.getElementById('btnCancel').onclick = () => sheet.classList.remove('show');
    document.getElementById('btnScan').onclick = () => {
      if (window.DashuaiNative && window.DashuaiNative.scanPairingCode) {
        window.DashuaiNative.scanPairingCode();
      } else {
        document.getElementById('lanHint').textContent = '当前环境不支持扫码，请粘贴连接码';
      }
    };
    document.getElementById('btnTest').onclick = async () => {
      const code = document.getElementById('pairingCode').value.trim();
      if (code) {
        try { parsePairingCode(code); } catch (e) {
          document.getElementById('lanHint').textContent = e.message || String(e);
          return;
        }
      }
      await testConnection();
    };
    document.getElementById('btnSave').onclick = () => {
      persistConnection(document.getElementById('baseUrl').value, document.getElementById('apiKey').value);
      state.model = document.getElementById('model').value;
      localStorage.setItem('ds_model', state.model);
      sheet.classList.remove('show');
      status.textContent = state.model + ' · 已保存';
    };

    restore();
    status.textContent = state.model + ' · 就绪';

    async function tryLanBootstrap(){
      const hint = document.getElementById('lanHint');
      const candidates = ['http://10.0.2.2:8010/api/bootstrap', 'http://127.0.0.1:8010/api/bootstrap'];
      for (const url of candidates){
        try{
          const res = await fetch(url, { method:'GET' });
          if (!res.ok) continue;
          const j = await res.json();
          if (j.lan_openai_base){
            if (hint) hint.textContent = '检测到局域网网关：' + j.lan_openai_base + '（真机可填此地址）';
            if (state.baseUrl.includes('10.0.2.2') && j.lan_openai_base){
              persistConnection(j.lan_openai_base, state.apiKey);
            }
          }
          if (j.local_api_key && state.apiKey === 'sk-local-change-me'){
            persistConnection(state.baseUrl, j.local_api_key);
          }
          break;
        }catch(_){}
      }
    }
    tryLanBootstrap();
    if (!localStorage.getItem('ds_base') || state.baseUrl.includes('10.0.2.2')) {
      setTimeout(() => {
        document.getElementById('btnSettings').click();
        document.getElementById('lanHint').textContent = '首次使用：请扫描电脑控制台「接入参数」中的二维码';
      }, 250);
    }
  </script>
</body>
</html>
