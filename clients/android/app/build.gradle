plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dashuai.gateway'
    compileSdk 34

    defaultConfig {
        applicationId "com.dashuai.gateway"
        minSdk 24
        targetSdk 34
        versionCode 505
        versionName "0.5.5"
    }

    signingConfigs {
        release {
            def storePath = System.getenv('DASHUAI_ANDROID_KEYSTORE')
            def storePass = System.getenv('DASHUAI_ANDROID_STORE_PASSWORD')
            def keyName = System.getenv('DASHUAI_ANDROID_KEY_ALIAS')
            def keyPass = System.getenv('DASHUAI_ANDROID_KEY_PASSWORD')
            if (storePath && storePass && keyName && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyName
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('DASHUAI_ANDROID_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
